name: Validate catalog

on:
  pull_request:
    paths:
      - "data/catalog.json"
      - "scripts/generate-readme.mjs"
      - "README.md"
      - "README.zh-CN.md"
  push:
    branches: [main]
    paths:
      - "data/catalog.json"
      - "scripts/generate-readme.mjs"
      - "README.md"
      - "README.zh-CN.md"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate README files
        run: node scripts/generate-readme.mjs
      - name: Ensure generated files are committed
        run: git diff --exit-code -- README.md README.zh-CN.md
      - name: Validate JSON and whitespace
        run: |
          node scripts/validate-catalog.mjs
          git diff --check
